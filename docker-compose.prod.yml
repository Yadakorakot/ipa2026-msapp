
services:
  mongo:
    ports: !override
      - "127.0.0.1:27018:27017"

  rabbitmq:
    ports: !override
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"

  web:
    image: ${DOCKERHUB_USERNAME}/web:latest
    ports: !override
      - "8081:8080"

  scheduler:
    image: ${DOCKERHUB_USERNAME}/scheduler:latest

  worker:
    image: ${DOCKERHUB_USERNAME}/worker:latest
